# Configuración de Netlify · FORJA Training Club
# Sitio estático: se publica la carpeta tal cual, sin compilación.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
